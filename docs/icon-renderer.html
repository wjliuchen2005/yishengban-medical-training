<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training Feedback Icons - High Resolution</title>
  <style>
    body {
      margin: 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
    }
    .icon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 30px;
      margin-top: 20px;
    }
    .icon-card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    .icon-wrapper {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .icon-wrapper svg {
      width: 60px;
      height: 60px;
    }
    .icon-wrapper.amber {
      background: #fff3db;
      color: #a76a08;
    }
    .icon-wrapper.slate {
      background: #edf2f5;
      color: #536b7d;
    }
    .icon-wrapper.violet {
      background: #f0ecfb;
      color: #6552a2;
    }
    .icon-wrapper.green {
      background: #e8f7ef;
      color: #23805b;
    }
    h3 {
      margin: 10px 0 5px;
      color: #21394a;
      font-size: 18px;
    }
    .label {
      color: #8495a1;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      margin-bottom: 5px;
    }
    .download-section {
      margin-top: 40px;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    button {
      background: #2c7be5;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      margin: 5px;
    }
    button:hover {
      background: #2364c0;
    }
    .instructions {
      color: #6c8190;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>训练复盘评价图标</h1>
  <p style="color: #6c8190;">Training Feedback Icons - High Resolution</p>

  <div class="icon-grid">
    <!-- Icon 1: NEXT - Aim -->
    <div class="icon-card">
      <div class="icon-wrapper amber" id="icon-next">
        <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
          <path d="M512 64C264.6 64 64 264.6 64 512s200.6 448 448 448 448-200.6 448-448S759.4 64 512 64zm0 820c-205.4 0-372-166.6-372-372s166.6-372 372-372 372 166.6 372 372-166.6 372-372 372z"/>
          <path d="M512 140c-205.4 0-372 166.6-372 372s166.6 372 372 372 372-166.6 372-372-166.6-372-372-372zm0 684c-172.3 0-312-139.7-312-312s139.7-312 312-312 312 139.7 312 312-139.7 312-312 312z"/>
          <path d="M512 216c-163.3 0-296 132.7-296 296s132.7 296 296 296 296-132.7 296-296-132.7-296-296-296zm0 532c-130.1 0-236-105.9-236-236s105.9-236 236-236 236 105.9 236 236-105.9 236-236 236z"/>
          <circle cx="512" cy="512" r="80"/>
        </svg>
      </div>
      <div class="label">NEXT</div>
      <h3>下一次重点</h3>
    </div>

    <!-- Icon 2: TIMELINE - Clock -->
    <div class="icon-card">
      <div class="icon-wrapper slate" id="icon-timeline">
        <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
          <path d="M512 64C264.6 64 64 264.6 64 512s200.6 448 448 448 448-200.6 448-448S759.4 64 512 64zm0 820c-205.4 0-372-166.6-372-372s166.6-372 372-372 372 166.6 372 372-166.6 372-372 372z"/>
          <path d="M686.7 638.6L544.1 535.5V288c0-4.4-3.6-8-8-8h-64c-4.4 0-8 3.6-8 8v275.4c0 2.6 1.2 5 3.3 6.5l165.4 120.6c3.6 2.6 8.6 1.8 11.2-1.7l28.6-39c2.6-3.7 1.8-8.7-1.8-11.2z"/>
        </svg>
      </div>
      <div class="label">TIMELINE</div>
      <h3>对话与决策回放</h3>
    </div>

    <!-- Icon 3: PATH REVIEW - Share -->
    <div class="icon-card">
      <div class="icon-wrapper violet" id="icon-path">
        <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
          <path d="M752 664c-28.5 0-54.8 10-75.4 26.7L469.4 540.8a160.68 160.68 0 0 0 0-57.6l207.2-149.9C697.2 350 723.5 360 752 360c66.2 0 120-53.8 120-120s-53.8-120-120-120-120 53.8-120 120c0 11.6 1.6 22.7 4.7 33.3L439.9 423.8a120.06 120.06 0 0 0-87.9-38.8c-66.2 0-120 53.8-120 120s53.8 120 120 120c34.2 0 65-14.3 87.9-38.8l196.8 150.5c-3 10.6-4.7 21.8-4.7 33.3 0 66.2 53.8 120 120 120s120-53.8 120-120-53.8-120-120-120zm0-476c28.7 0 52 23.3 52 52s-23.3 52-52 52-52-23.3-52-52 23.3-52 52-52zM352 556c-28.7 0-52-23.3-52-52s23.3-52 52-52 52 23.3 52 52-23.3 52-52 52zm400 300c-28.7 0-52-23.3-52-52s23.3-52 52-52 52 23.3 52 52-23.3 52-52 52z"/>
        </svg>
      </div>
      <div class="label">PATH REVIEW</div>
      <h3>决策路径对比</h3>
    </div>

    <!-- Icon 4: KEEP - CircleCheck -->
    <div class="icon-card">
      <div class="icon-wrapper green" id="icon-keep">
        <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
          <path d="M512 64C264.6 64 64 264.6 64 512s200.6 448 448 448 448-200.6 448-448S759.4 64 512 64zm0 820c-205.4 0-372-166.6-372-372s166.6-372 372-372 372 166.6 372 372-166.6 372-372 372z"/>
          <path d="M699.3 412.3L469.5 642.1 370.7 543.3c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l121.4 121.4c12.5 12.5 32.8 12.5 45.3 0l252.4-252.4c12.5-12.5 12.5-32.8 0-45.3-12.5-12.5-32.8-12.5-45.2 0z"/>
        </svg>
      </div>
      <div class="label">KEEP</div>
      <h3>做得好的地方</h3>
    </div>
  </div>

  <div class="download-section">
    <h2>下载图标</h2>
    <div>
      <button onclick="downloadIcon('icon-next', 'next-focus-icon.png')">下载 NEXT 图标</button>
      <button onclick="downloadIcon('icon-timeline', 'timeline-icon.png')">下载 TIMELINE 图标</button>
      <button onclick="downloadIcon('icon-path', 'path-review-icon.png')">下载 PATH REVIEW 图标</button>
      <button onclick="downloadIcon('icon-keep', 'keep-icon.png')">下载 KEEP 图标</button>
    </div>
    <button onclick="downloadAllIcons()" style="background: #23805b; margin-top: 15px;">批量下载所有图标</button>
    <div class="instructions">
      点击按钮下载透明背景的高清PNG图标（1024x1024px）
    </div>
  </div>

  <script>
    async function downloadIcon(iconId, filename) {
      const iconElement = document.getElementById(iconId);
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const size = 1024;

      canvas.width = size;
      canvas.height = size;

      // Get computed styles
      const bgColor = window.getComputedStyle(iconElement).backgroundColor;
      const color = window.getComputedStyle(iconElement).color;
      const borderRadius = 24;

      // Draw rounded rectangle background
      ctx.fillStyle = bgColor;
      roundRect(ctx, 0, 0, size, size, borderRadius * (size / 120));
      ctx.fill();

      // Get SVG content
      const svgElement = iconElement.querySelector('svg');
      const svgData = new XMLSerializer().serializeToString(svgElement);
      const svgBlob = new Blob([svgData.replace(/currentColor/g, color)], {type: 'image/svg+xml;charset=utf-8'});
      const url = URL.createObjectURL(svgBlob);

      const img = new Image();
      img.onload = function() {
        const iconSize = size / 2;
        const offset = (size - iconSize) / 2;
        ctx.drawImage(img, offset, offset, iconSize, iconSize);

        canvas.toBlob(function(blob) {
          const link = document.createElement('a');
          link.download = filename;
          link.href = URL.createObjectURL(blob);
          link.click();
          URL.revokeObjectURL(url);
        }, 'image/png');
      };
      img.src = url;
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    async function downloadAllIcons() {
      const icons = [
        { id: 'icon-next', name: 'next-focus-icon.png' },
        { id: 'icon-timeline', name: 'timeline-icon.png' },
        { id: 'icon-path', name: 'path-review-icon.png' },
        { id: 'icon-keep', name: 'keep-icon.png' }
      ];

      for (const icon of icons) {
        await new Promise(resolve => setTimeout(resolve, 300));
        downloadIcon(icon.id, icon.name);
      }
    }
  </script>
</body>
</html>
